name: CI

# While the repository is private, macOS minutes count ten times, so this runs one job: on pushes to
# main that change more than docs, on pull requests, and when started by hand. Once the repository is
# public, the same workflow runs the full matrix by itself, with nothing to edit: builds on the oldest
# supported macOS, whose Xcode 16 SDK has no FoundationModels, and the current one, then the packaged
# app on macOS 15 on Apple silicon and Intel.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["macos-26"]' || '["macos-15", "macos-26"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select --print-path
          swift --version

      - name: Test
        run: make test

      # Only AzureDevOpsCore uses the network, and only BriefBarCore starts programs.
      - name: Check the boundaries
        run: make check-boundaries

      - name: Check the demo data
        run: make demo-check

      # A throwaway certificate in a keychain of its own.
      - name: Create a signing certificate
        run: |
          KEYCHAIN="$(./scripts/ci-signing-identity.sh "$RUNNER_TEMP")"
          echo "BRIEFBAR_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The universal app, checked and zipped (see scripts/package.sh).
      - name: Package the app
        run: make package

      - name: Upload the package
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BriefBar
          path: build/release/
          if-no-files-found: error

  run-package:
    name: Run the package (${{ matrix.os }})
    needs: build
    # Once the repository is public, where macOS minutes don't count ten times.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported macOS, on Apple silicon and on Intel.
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BriefBar
          path: build/release

      - name: Unzip the app
        run: |
          (cd build/release && shasum -a 256 -c BriefBar.zip.sha256)
          ditto -x -k build/release/BriefBar.zip build

      # Launches it, without FoundationModels, and runs the demo check.
      - name: Check the app
        run: ./scripts/check-app.sh build/BriefBar.app --universal
