name: CI

# On pushes to main that change more than docs and BriefBar for Windows, on pull requests, and when started by hand.
# Builds and tests on macOS 26, the oldest macOS BriefBar supports, packages the Apple silicon app, signs its update
# the way a release does and installs an update through its updater. A pull request that changes only BriefBar for
# Windows (windows/ and its workflow) builds nothing here, but its check still passes.
on:
  # Not for a push that changes only BriefBar for Windows: each run on main builds the Mac app, so a newer run that
  # cancels an older one builds everything that one would have.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new run cancels the one in progress on the same pull request or branch, main included.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which apps this run builds (scripts/ci-changes.sh).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.changes.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and the branch it goes into; for a push, the commit it came after.
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}

      - name: Find what changed
        id: changes
        run: scripts/ci-changes.sh
        env:
          PUSHED_FROM: ${{ github.event.before }}

  # The check main requires, so it always runs, and passes without building when the Mac app didn't change: then it
  # skips every step, on Linux. Skipped instead, it would report as "Build and test (${{ matrix.os }})", which no
  # required check matches. If what changed couldn't be found, it builds.
  build:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.mac == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.mac != 'false'
        with:
          persist-credentials: false

      - name: Show toolchain
        if: needs.changes.outputs.mac != 'false'
        run: |
          sw_vers
          xcode-select --print-path
          swift --version

      # make test, build included, takes two to three minutes on GitHub's runners, so a test run that hangs ends
      # at ten minutes, not at the job's limit.
      - name: Test
        if: needs.changes.outputs.mac != 'false'
        run: make test
        timeout-minutes: 10

      # BriefBar's extension for the Copilot app's sessions, with the runner's Node and a stand-in for the Copilot SDK.
      - name: Test the session extension
        if: needs.changes.outputs.mac != 'false'
        run: |
          node --version
          make plugin-test
        timeout-minutes: 5

      # Only AzureDevOpsCore and GitHubCore use the network, and only BriefBarCore starts programs.
      - name: Check the boundaries
        if: needs.changes.outputs.mac != 'false'
        run: make check-boundaries

      - name: Check the demo data
        if: needs.changes.outputs.mac != 'false'
        run: make demo-check

      # It's macOS that enforces what keeps the keys safe, so this checks it here, in throwaway keychains.
      - name: Check the signing keys' protection
        if: needs.changes.outputs.mac != 'false'
        run: make signing-key-check

      # The release workflow's last step, which points the Homebrew cask at a release, against a tap of its own
      # on the runner, with no key.
      - name: Check the Homebrew cask update
        if: needs.changes.outputs.mac != 'false'
        run: make homebrew-cask-check

      # A throwaway certificate in a keychain of its own, on the search list. Only the release workflow's
      # approved job has the release certificate.
      - name: Create a signing certificate
        if: needs.changes.outputs.mac != 'false'
        run: |
          KEYCHAIN="$(./scripts/ci-signing-identity.sh "$RUNNER_TEMP")"
          echo "BRIEFBAR_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The Apple silicon app that a release ships, checked and zipped (see scripts/package.sh).
      - name: Package the app
        if: needs.changes.outputs.mac != 'false'
        run: make package

      # Signs the package's update the way a release does, with a throwaway key instead of the real one.
      - name: Check the update signing
        if: needs.changes.outputs.mac != 'false'
        run: ./scripts/appcast-dry-run.sh

      # The updater holds Sparkle with library validation off. In a copy of the package that macOS opens, it's
      # responsible for itself, and other code in Sparkle's place never runs as BriefBar.
      - name: Check the updater's isolation
        if: needs.changes.outputs.mac != 'false'
        run: ./scripts/test-updater-isolation.sh build/BriefBar.app

      # A copy of the package installs a newer one through the updater, from a signed feed on the runner.
      - name: Rehearse an update
        if: needs.changes.outputs.mac != 'false'
        run: ./scripts/update-rehearsal.sh build/BriefBar.app

      # The release workflow builds on macos-26 too, so this is what a release would contain, apart from the
      # certificate.
      - name: Upload the package
        if: needs.changes.outputs.mac != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BriefBar
          path: build/release/
          if-no-files-found: error
