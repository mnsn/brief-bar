name: CI

# On pushes to main that change more than docs, on pull requests, and when started by hand. Builds and tests on
# the oldest supported macOS, whose Xcode 16 SDK has no FoundationModels, and the current one, packages the
# universal app and signs its update the way a release does, then runs the package on macOS 15 on Apple silicon
# and Intel.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select --print-path
          swift --version

      # make test, build included, takes two to three minutes on GitHub's runners, so a test run that hangs ends
      # at ten minutes, not at the job's limit.
      - name: Test
        run: make test
        timeout-minutes: 10

      # Only AzureDevOpsCore and GitHubCore use the network, and only BriefBarCore starts programs.
      - name: Check the boundaries
        run: make check-boundaries

      - name: Check the demo data
        run: make demo-check

      # On both versions of macOS, since it's macOS that enforces what keeps the keys safe.
      - name: Check the signing keys' protection
        run: make signing-key-check

      # A throwaway certificate in a keychain of its own, on the search list. Only the release workflow's
      # approved job has the release certificate.
      - name: Create a signing certificate
        run: |
          KEYCHAIN="$(./scripts/ci-signing-identity.sh "$RUNNER_TEMP")"
          echo "BRIEFBAR_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # The universal app that a release ships, checked and zipped (see scripts/package.sh).
      - name: Package the app
        run: make package

      # Signs the package's update the way a release does, with a throwaway key instead of the real one.
      - name: Check the update signing
        run: ./scripts/appcast-dry-run.sh

      # The updater holds Sparkle with library validation off. In a copy of the package that macOS opens, it's
      # responsible for itself, and other code in Sparkle's place never runs as BriefBar.
      - name: Check the updater's isolation
        run: ./scripts/test-updater-isolation.sh build/BriefBar.app

      # A copy of the package installs a newer one through the updater, from a signed feed on the runner.
      - name: Rehearse an update
        run: ./scripts/update-rehearsal.sh build/BriefBar.app

      # The release workflow builds on macos-26 too, so this is what a release would contain, apart from the
      # certificate.
      - name: Upload the package
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BriefBar
          path: build/release/
          if-no-files-found: error

  run-package:
    name: Run the package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported macOS, on Apple silicon and on Intel.
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BriefBar
          path: build/release

      - name: Unzip the app
        run: |
          (cd build/release && shasum -a 256 -c BriefBar.zip.sha256)
          ditto -x -k build/release/BriefBar.zip build

      # Launches it without FoundationModels, starts its updater, which loads Sparkle under the hardened
      # runtime, and runs the demo check.
      - name: Check the app
        run: ./scripts/check-app.sh build/BriefBar.app --universal

      - name: Check the updater's isolation
        run: ./scripts/test-updater-isolation.sh build/BriefBar.app
