name: Release

# Pushing a version tag such as v0.1.0 publishes a GitHub release with the universal app and the appcast that
# the app's updater reads. The tag must match CFBundleShortVersionString in Resources/Info.plist and be higher
# than every earlier tag, and CHANGELOG.md needs a section for that version; it becomes the release notes. See
# "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build the release
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, to check that the version is higher

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select --print-path
          swift --version

      # make test, build included, takes two to three minutes on GitHub's runners, so a test run that hangs ends
      # at ten minutes, not at the job's limit.
      - name: Test
        run: make test
        timeout-minutes: 10

      # Only AzureDevOpsCore uses the network, and only BriefBarCore starts programs.
      - name: Check the boundaries
        run: make check-boundaries

      # A throwaway certificate: this job has no secrets. The publish job signs the app again with the release
      # certificate.
      - name: Create a signing certificate
        run: |
          KEYCHAIN="$(./scripts/ci-signing-identity.sh "$RUNNER_TEMP")"
          echo "BRIEFBAR_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Checks the tag, the version and the changelog, then builds, checks and zips the universal app.
      - name: Package the app
        run: ./scripts/package.sh "$GITHUB_REF_NAME"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/release/
          if-no-files-found: error

  # Signs exactly what the build job packaged: the app with the release certificate, then the update with the
  # update signing key. Only this job's environment holds them, and it waits for a maintainer's approval.
  publish:
    name: Sign and publish the release
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # to create the release
      id-token: write # to sign the build provenance attestation
      attestations: write # to store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/release

      - name: Check the package
        run: cd build/release && shasum -a 256 -c BriefBar.zip.sha256

      # Into a keychain of its own, on the search list, which the step after signing deletes. Only codesign may
      # use the key, and nothing can export it.
      - name: Import the release certificate
        env:
          RELEASE_CERTIFICATE_P12: ${{ secrets.RELEASE_CERTIFICATE_P12 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$(./scripts/import-release-identity.sh "$RUNNER_TEMP")"
          echo "BRIEFBAR_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Signs with exactly the release certificate, by its SHA-1, and fails unless the app then has the
      # designated requirement in Resources/ReleaseRequirement.txt, the one every release has: users' Full Disk
      # Access depends on it.
      - name: Sign the app
        run: ./scripts/sign-release.sh build/release

      - name: Delete the release certificate
        if: always()
        run: |
          if [ -n "${BRIEFBAR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$BRIEFBAR_SIGNING_KEYCHAIN"
          fi

      - name: Get Sparkle's tools
        run: swift package resolve

      # The key goes to generate_appcast on standard input only, never in an argument.
      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The release environment has no SPARKLE_PRIVATE_KEY secret."
            exit 1
          fi
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | env -u SPARKLE_PRIVATE_KEY ./scripts/make-appcast.sh \
            build/release "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"

      # Checks with the public key in Info.plist, which the installed apps have too.
      - name: Check the signatures
        run: >-
          swift scripts/verify-appcast.swift build/release/appcast.xml build/release/BriefBar.zip
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist)"
          "${GITHUB_REF_NAME#v}"

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/BriefBar.zip
            build/release/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "BriefBar ${GITHUB_REF_NAME#v}"
          --notes-file build/release/notes.md
          build/release/BriefBar.zip build/release/BriefBar.zip.sha256
          build/release/appcast.xml
