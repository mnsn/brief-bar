name: Windows

# BriefBar for Windows (windows/), on pushes to main and pull requests that change it, and when started by hand.
# Checks formatting, tests BriefBar.Core and builds the WinUI 3 app for x64 and Arm64 on Windows. The macOS CI doesn't
# build it, and this doesn't build the Mac app.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new run cancels the one in progress on the same pull request or branch, main included.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 20
    # windows/global.json picks the SDK and has `dotnet test` use Microsoft.Testing.Platform, from windows/ only.
    defaults:
      run:
        working-directory: windows
    steps:
      # Lines end in LF, as .editorconfig says, on Windows too, so the format check sees what's committed.
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Style and analyzers are checked as the projects build, with warnings as errors; this checks whitespace.
      - name: Check formatting
        run: dotnet format whitespace . --folder --verify-no-changes

      - name: Test BriefBar.Core
        run: dotnet test --project BriefBar.Core.Tests/BriefBar.Core.Tests.csproj --configuration Release

      # The Windows App SDK comes from NuGet with the first restore, and ships inside the app.
      - name: Build for x64
        run: dotnet build BriefBar/BriefBar.csproj --configuration Release --runtime win-x64

      - name: Build for Arm64
        run: dotnet build BriefBar/BriefBar.csproj --configuration Release --runtime win-arm64
